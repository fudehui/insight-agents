[project]
name = "insight-agents"
version = "0.1.0"
description = "Conversational multi-agent deep research system built on DeepAgents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.0.0",
    "aiosqlite>=0.22.1",
    "deepagents==0.5.7",
    "fastapi>=0.100.0",
    "langchain==1.2.17",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdown>=3.5",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "ragflow-sdk>=0.1.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "tavily-python==0.7.24",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff.lint]
# 显式锁定规则集：ruff 0.16 起默认规则集扩大（UP/BLE/SIM/I 等），
# 一次性引入会对存量代码产生 80+ 告警。这里保持与项目历史行为一致的
# 基线（错误类 + pyflakes），后续想启用新规则再逐步放开
select = ["E4", "E7", "E9", "F"]
