name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 后端模块导入即初始化模型/RAGFlow/Tavily 客户端（不发起真实请求），
    # CI 环境用占位变量补齐 .env 缺失
    env:
      LLM_QWEN_MAX: ci-test-model
      OPENAI_API_KEY: sk-ci-dummy
      OPENAI_BASE_URL: https://example.invalid/v1
      TAVILY_API_KEY: tvly-ci-dummy
      RAGFLOW_API_URL: http://127.0.0.1:9380
      RAGFLOW_API_KEY: ragflow-ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run --frozen ruff check app tests
      - name: Ruff format check
        run: uv run --frozen ruff format --check app tests
      - name: Pytest
        run: uv run --frozen python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
