<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .layer-title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .box-text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .hint { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .layer { stroke-width: 3; rx: 22; }
      .box { fill: #ffffff; stroke-width: 2; rx: 12; filter: drop-shadow(0 4px 7px rgba(15, 23, 42, 0.12)); }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrow-green); stroke-dasharray: 8 7; }
      .arrow-slate { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow-slate); }
    </style>
  </defs>

  <rect width="1280" height="1090" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">慧研系统架构图</text>
  <text x="640" y="70" text-anchor="middle" class="small">前端提交任务 -> FastAPI 后台协程 -> DeepAgents 调度多来源工具与沙箱计算 -> 治理层全程护航 -> 带引用与图表的报告交付</text>

  <!-- 用户交互层 -->
  <rect x="24" y="92" width="1232" height="118" class="layer" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="48" y="126" class="layer-title">用户交互层</text>
  <rect x="260" y="118" width="220" height="66" class="box" stroke="#0284c7"/>
  <text x="370" y="144" text-anchor="middle" class="box-title">React + Vite 前端</text>
  <text x="370" y="168" text-anchor="middle" class="box-text">对话 / 上传 / 编辑 / 产物</text>
  <rect x="545" y="118" width="220" height="66" class="box" stroke="#0284c7"/>
  <text x="655" y="144" text-anchor="middle" class="box-title">HTTP 命令通道</text>
  <text x="655" y="168" text-anchor="middle" class="box-text">任务 / 上传 / 下载 / 修订</text>
  <rect x="830" y="118" width="220" height="66" class="box" stroke="#0284c7"/>
  <text x="940" y="144" text-anchor="middle" class="box-title">WebSocket 进度通道</text>
  <text x="940" y="168" text-anchor="middle" class="box-text">工具事件 / 结果 / 异常</text>
  <rect x="1075" y="118" width="175" height="66" class="box" stroke="#0284c7"/>
  <text x="1162" y="144" text-anchor="middle" class="box-title">外部 Agent 宿主</text>
  <text x="1162" y="168" text-anchor="middle" class="box-text">Claude Code 等</text>

  <!-- API layer -->
  <rect x="24" y="232" width="1232" height="142" class="layer" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="48" y="266" class="layer-title">API 与实时通信层</text>
  <rect x="70" y="292" width="210" height="58" class="box" stroke="#16a34a"/>
  <text x="175" y="316" text-anchor="middle" class="box-title">FastAPI server.py</text>
  <text x="175" y="339" text-anchor="middle" class="box-text">lifespan 绑定事件循环</text>
  <rect x="340" y="292" width="210" height="58" class="box" stroke="#16a34a"/>
  <text x="445" y="316" text-anchor="middle" class="box-title">任务接口</text>
  <text x="445" y="339" text-anchor="middle" class="box-text">/api/task + active_tasks</text>
  <rect x="610" y="292" width="210" height="58" class="box" stroke="#16a34a"/>
  <text x="715" y="316" text-anchor="middle" class="box-title">文件与报告接口</text>
  <text x="715" y="339" text-anchor="middle" class="box-text">files / reports / memories</text>
  <rect x="880" y="292" width="250" height="58" class="box" stroke="#16a34a"/>
  <text x="1005" y="316" text-anchor="middle" class="box-title">ConnectionManager</text>
  <text x="1005" y="339" text-anchor="middle" class="box-text">thread_id -> websocket</text>

  <!-- Agent layer -->
  <rect x="24" y="398" width="1232" height="164" class="layer" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="48" y="432" class="layer-title">DeepAgents 调度层</text>
  <rect x="74" y="462" width="230" height="66" class="box" stroke="#f59e0b"/>
  <text x="189" y="488" text-anchor="middle" class="box-title">main_agent.py</text>
  <text x="189" y="512" text-anchor="middle" class="box-text">create_deep_agent + 中间件</text>
  <rect x="370" y="462" width="230" height="66" class="box" stroke="#f59e0b"/>
  <text x="485" y="488" text-anchor="middle" class="box-title">run_deep_agent</text>
  <text x="485" y="512" text-anchor="middle" class="box-text">会话目录 + 记忆先验注入</text>
  <rect x="666" y="462" width="230" height="66" class="box" stroke="#f59e0b"/>
  <text x="781" y="488" text-anchor="middle" class="box-title">ContextVar</text>
  <text x="781" y="512" text-anchor="middle" class="box-text">thread_id / session_dir</text>
  <rect x="962" y="462" width="230" height="66" class="box" stroke="#f59e0b"/>
  <text x="1077" y="488" text-anchor="middle" class="box-title">monitor.py</text>
  <text x="1077" y="512" text-anchor="middle" class="box-text">assistant / tool / result</text>

  <!-- Governance layer -->
  <rect x="24" y="586" width="1232" height="164" class="layer" fill="#ffe4e6" stroke="#e11d48" stroke-dasharray="10 8"/>
  <text x="48" y="620" class="layer-title">治理与协议扩展层（横切：作用于全部工具调用）</text>
  <rect x="74" y="648" width="230" height="72" class="box" stroke="#e11d48"/>
  <text x="189" y="675" text-anchor="middle" class="box-title">TokenBudgetMiddleware</text>
  <text x="189" y="699" text-anchor="middle" class="box-text">累计预算 / 超限强制收尾</text>
  <rect x="370" y="648" width="230" height="72" class="box" stroke="#e11d48"/>
  <text x="485" y="675" text-anchor="middle" class="box-title">三档审批 HITL</text>
  <text x="485" y="699" text-anchor="middle" class="box-text">interrupt_on / 审批卡片</text>
  <rect x="666" y="648" width="230" height="72" class="box" stroke="#e11d48"/>
  <text x="781" y="675" text-anchor="middle" class="box-title">跨会话长期记忆</text>
  <text x="781" y="699" text-anchor="middle" class="box-text">app/memory / SqliteVecStore</text>
  <rect x="962" y="648" width="230" height="72" class="box" stroke="#e11d48"/>
  <text x="1077" y="675" text-anchor="middle" class="box-title">MCP Server</text>
  <text x="1077" y="699" text-anchor="middle" class="box-text">SSE · stdio / 白名单 4 工具</text>

  <!-- Workers/tools layer -->
  <rect x="24" y="774" width="1232" height="168" class="layer" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="48" y="808" class="layer-title">子智能体与工具层</text>
  <rect x="52" y="836" width="216" height="72" class="box" stroke="#9333ea"/>
  <text x="160" y="863" text-anchor="middle" class="box-title">网络搜索助手</text>
  <text x="160" y="887" text-anchor="middle" class="box-text">Tavily internet_search</text>
  <rect x="292" y="836" width="216" height="72" class="box" stroke="#9333ea"/>
  <text x="400" y="863" text-anchor="middle" class="box-title">数据库查询助手</text>
  <text x="400" y="887" text-anchor="middle" class="box-text">list / preview / execute SQL</text>
  <rect x="532" y="836" width="216" height="72" class="box" stroke="#9333ea"/>
  <text x="640" y="863" text-anchor="middle" class="box-title">RAGFlow 助手</text>
  <text x="640" y="887" text-anchor="middle" class="box-text">助手列表 / 临时会话问答</text>
  <rect x="772" y="836" width="216" height="72" class="box" stroke="#9333ea"/>
  <text x="880" y="863" text-anchor="middle" class="box-title">数据分析助手</text>
  <text x="880" y="887" text-anchor="middle" class="box-text">run_code 沙箱执行</text>
  <rect x="1012" y="836" width="216" height="72" class="box" stroke="#9333ea"/>
  <text x="1120" y="863" text-anchor="middle" class="box-title">文件与图表工具</text>
  <text x="1120" y="887" text-anchor="middle" class="box-text">md / chart / pdf / 记忆写入</text>

  <!-- Data/output layer -->
  <rect x="24" y="966" width="1232" height="96" class="layer" fill="#f1f5f9" stroke="#475569"/>
  <text x="48" y="1000" class="layer-title">数据源与产物层</text>
  <rect x="60" y="1010" width="152" height="36" class="box" stroke="#475569"/>
  <text x="136" y="1034" text-anchor="middle" class="box-text">公开网页 / 新闻</text>
  <rect x="227" y="1010" width="152" height="36" class="box" stroke="#475569"/>
  <text x="303" y="1034" text-anchor="middle" class="box-text">SQLite 业务库</text>
  <rect x="394" y="1010" width="152" height="36" class="box" stroke="#475569"/>
  <text x="470" y="1034" text-anchor="middle" class="box-text">RAGFlow 知识库</text>
  <rect x="561" y="1010" width="152" height="36" class="box" stroke="#475569"/>
  <text x="637" y="1034" text-anchor="middle" class="box-text">huiyan-sandbox 容器</text>
  <rect x="728" y="1010" width="152" height="36" class="box" stroke="#475569"/>
  <text x="804" y="1034" text-anchor="middle" class="box-text">updated/session 上传</text>
  <rect x="895" y="1010" width="152" height="36" class="box" stroke="#475569"/>
  <text x="971" y="1034" text-anchor="middle" class="box-text">output: MD/PDF/PNG</text>
  <rect x="1062" y="1010" width="152" height="36" class="box" stroke="#475569"/>
  <text x="1138" y="1034" text-anchor="middle" class="box-text">memory.db 记忆</text>

  <!-- arrows main flow -->
  <path class="arrow-blue" d="M 655 184 L 655 292"/>
  <path class="arrow-blue" d="M 445 350 L 445 462"/>
  <path class="arrow-slate" d="M 280 321 L 340 321"/>
  <path class="arrow-slate" d="M 550 321 L 610 321"/>
  <path class="arrow-green" d="M 940 184 L 1005 292"/>
  <path class="arrow-slate" d="M 304 495 L 370 495"/>
  <path class="arrow-slate" d="M 600 495 L 666 495"/>
  <path class="arrow-slate" d="M 896 495 L 962 495"/>
  <path class="arrow-blue" d="M 640 562 L 640 586"/>
  <path class="arrow-blue" d="M 640 750 L 640 774"/>
  <path class="arrow-slate" d="M 160 908 C 160 962 136 966 136 1010"/>
  <path class="arrow-slate" d="M 400 908 C 400 962 303 966 303 1010"/>
  <path class="arrow-slate" d="M 640 908 C 640 962 470 966 470 1010"/>
  <path class="arrow-slate" d="M 880 908 C 880 962 637 966 637 1010"/>
  <path class="arrow-slate" d="M 1120 908 C 1120 962 971 966 971 1010"/>
  <path class="arrow-slate" d="M 1108 908 C 1108 950 804 958 804 1010"/>

  <!-- memory flows: 召回先验 / 读写 memory.db -->
  <path class="arrow-green" d="M 745 648 C 700 604 620 570 545 528"/>
  <text x="654" y="600" class="small">召回先验</text>
  <path class="arrow-slate" d="M 860 720 C 930 752 1002 790 1002 860 L 1002 950 C 1002 992 1080 1004 1138 1010"/>
  <path class="arrow-slate" d="M 1138 1010 L 1140 1010"/>

  <!-- external agent -> MCP server -->
  <path class="arrow-green" d="M 1162 184 C 1240 280 1240 450 1220 560 C 1200 628 1130 638 1095 648"/>
  <text x="1150" y="224" class="small">SSE / stdio 调用工具</text>

  <!-- websocket return arrow -->
  <path class="arrow-green" d="M 1077 462 C 1188 430 1195 230 1010 184"/>
  <text x="1172" y="250" text-anchor="middle" class="hint">WebSocket 实时回传</text>
  <text x="1172" y="270" text-anchor="middle" class="small">tool_start / assistant_call</text>
  <text x="1172" y="289" text-anchor="middle" class="small">task_result / error</text>

  <!-- labels -->
  <text x="610" y="224" class="hint">HTTP 发命令，WebSocket 回进度</text>
  <text x="42" y="392" class="small">server.py 只做轻量调度，真正长耗时任务交给后台协程</text>
  <text x="700" y="578" class="small">主智能体召回记忆先验；沙箱负责定量计算</text>
  <text x="700" y="768" class="small">Token 预算 / 审批 / 记忆 / MCP 护航全部工具调用</text>
</svg>
